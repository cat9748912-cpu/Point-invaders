<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POINT INVADERS — Arcade Hub 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04040e;--s1:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.22);
  --cyan:#00f5ff;--pink:#ff0090;--lime:#39ff14;--gold:#ffd700;
  --purple:#a855f7;--orange:#ff6600;--red:#ff2442;
  --text:#fff;--dim:rgba(255,255,255,0.55);--dimmer:rgba(255,255,255,0.28);
  --fd:'Orbitron',monospace;--fb:'Rajdhani',sans-serif;--r:12px;--rl:18px
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── SCREEN SYSTEM ── */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;transform:translateY(10px)}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0)}

/* ── TYPE ── */
.logo{font-family:var(--fd);font-weight:900;font-size:clamp(1.8rem,5vw,3.5rem);background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.05em;line-height:1;text-align:center}
.tagline{font-family:var(--fd);font-size:.55rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:8px;text-align:center}
.sec-label{font-family:var(--fd);font-size:.6rem;font-weight:700;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}

/* ── BUTTONS ── */
.btn{font-family:var(--fd);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:11px 26px;border:none;border-radius:8px;cursor:pointer;transition:all .2s ease;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#000;box-shadow:0 0 20px rgba(0,245,255,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(0,245,255,.45)}
.btn-primary:active{transform:scale(.96)}
.btn-secondary{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(255,255,255,.14);border-color:var(--border2)}
.btn-danger{background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff}
.btn-full{width:100%}.btn-lg{padding:14px 36px;font-size:.8rem}.btn-sm{padding:7px 16px;font-size:.6rem}

/* ── CARD / INPUT ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);backdrop-filter:blur(20px);padding:24px}
.input{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:1rem;font-weight:600;padding:11px 16px;outline:none;transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:var(--dimmer)}
.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,255,.1)}
.input-label{display:block;font-size:.7rem;font-weight:600;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;font-family:var(--fd)}
.field{margin-bottom:14px}

/* ── AUTH SCREEN ── */
#auth-screen .wrap{width:100%;max-width:400px;text-align:center}
.auth-icon{font-size:4rem;display:block;margin-bottom:16px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.auth-tabs{display:flex;gap:8px;margin-bottom:22px}
.auth-tab{flex:1;font-family:var(--fd);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--dim);cursor:pointer;transition:all .2s}
.auth-tab.active{background:rgba(0,245,255,.1);border-color:var(--cyan);color:var(--cyan)}
.auth-err{min-height:20px;font-size:.8rem;color:var(--pink);font-weight:600;margin-top:10px;text-align:center}

/* ── HUB SCREEN ── */
#hub-screen{justify-content:flex-start;padding-top:20px}
.hub-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:1060px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px 20px;margin-bottom:20px;flex-shrink:0}
.hub-logo-sm{font-family:var(--fd);font-size:.85rem;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hub-right{display:flex;align-items:center;gap:10px}
.hub-uname{font-family:var(--fd);font-size:.65rem;color:var(--cyan)}
.hub-pts{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:5px 14px;font-family:var(--fd);font-size:.6rem;font-weight:700;color:var(--gold)}
.hub-body{display:grid;grid-template-columns:1fr 300px;gap:20px;width:100%;max-width:1060px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;align-content:start}
.game-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:22px 16px;text-align:center;cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.game-card:hover{transform:translateY(-5px) scale(1.02)}
.game-card[data-c="cyan"]:hover  {border-color:var(--cyan);  box-shadow:0 8px 30px rgba(0,245,255,.2)}
.game-card[data-c="pink"]:hover  {border-color:var(--pink);  box-shadow:0 8px 30px rgba(255,0,144,.2)}
.game-card[data-c="lime"]:hover  {border-color:var(--lime);  box-shadow:0 8px 30px rgba(57,255,20,.2)}
.game-card[data-c="gold"]:hover  {border-color:var(--gold);  box-shadow:0 8px 30px rgba(255,215,0,.2)}
.game-card[data-c="purple"]:hover{border-color:var(--purple);box-shadow:0 8px 30px rgba(168,85,247,.2)}
.game-card[data-c="orange"]:hover{border-color:var(--orange);box-shadow:0 8px 30px rgba(255,102,0,.2)}
.game-card[data-c="red"]:hover   {border-color:var(--red);   box-shadow:0 8px 30px rgba(255,36,66,.2)}
.gc-icon{font-size:2.8rem;display:block;margin-bottom:10px}
.gc-name{font-family:var(--fd);font-size:.6rem;font-weight:700;letter-spacing:.08em;margin-bottom:8px}
.gc-name[data-c="cyan"]  {color:var(--cyan)}
.gc-name[data-c="pink"]  {color:var(--pink)}
.gc-name[data-c="lime"]  {color:var(--lime)}
.gc-name[data-c="gold"]  {color:var(--gold)}
.gc-name[data-c="purple"]{color:var(--purple)}
.gc-name[data-c="orange"]{color:var(--orange)}
.gc-name[data-c="red"]   {color:var(--red)}
.gc-desc{font-size:.75rem;color:var(--dim);line-height:1.45;margin-bottom:12px}
.gc-pts{display:inline-block;padding:3px 12px;border-radius:20px;font-family:var(--fd);font-size:.5rem;font-weight:700;border:1px solid}
.gc-pts[data-c="cyan"]  {color:var(--cyan);  border-color:var(--cyan);  background:rgba(0,245,255,.06)}
.gc-pts[data-c="pink"]  {color:var(--pink);  border-color:var(--pink);  background:rgba(255,0,144,.06)}
.gc-pts[data-c="lime"]  {color:var(--lime);  border-color:var(--lime);  background:rgba(57,255,20,.06)}
.gc-pts[data-c="gold"]  {color:var(--gold);  border-color:var(--gold);  background:rgba(255,215,0,.06)}
.gc-pts[data-c="purple"]{color:var(--purple);border-color:var(--purple);background:rgba(168,85,247,.06)}
.gc-pts[data-c="orange"]{color:var(--orange);border-color:var(--orange);background:rgba(255,102,0,.06)}
.gc-pts[data-c="red"]   {color:var(--red);   border-color:var(--red);   background:rgba(255,36,66,.06)}
.gc-ext{position:absolute;top:8px;right:8px;font-size:.48rem;font-family:var(--fd);color:var(--dimmer);border:1px solid var(--border);border-radius:4px;padding:2px 6px;letter-spacing:.05em}

/* ── LEADERBOARD ── */
.lb-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:18px;overflow-y:auto;max-height:520px}
.lb-title{font-family:var(--fd);font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px;text-align:center}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--s2);margin-bottom:7px}
.lb-row.me   {border-color:var(--cyan);background:rgba(0,245,255,.05)}
.lb-row.r1   {border-color:rgba(255,215,0,.5);background:rgba(255,215,0,.06)}
.lb-row.r2   {border-color:rgba(192,192,192,.4)}
.lb-row.r3   {border-color:rgba(205,127,50,.4)}
.lb-rank{font-family:var(--fd);font-size:.9rem;font-weight:900;width:26px;text-align:center;color:var(--dimmer)}
.lb-row.r1 .lb-rank{color:var(--gold)}.lb-row.r2 .lb-rank{color:#c0c0c0}.lb-row.r3 .lb-rank{color:#cd7f32}
.lb-name{flex:1;font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-family:var(--fd);font-size:.65rem;color:var(--gold)}
.lb-empty{color:var(--dim);font-size:.82rem;text-align:center;padding:30px 0}

/* ── GAME SCREEN ── */
#game-screen{justify-content:flex-start;padding-top:18px}
.g-hdr{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:700px;margin-bottom:12px}
.g-title{font-family:var(--fd);font-size:.95rem;font-weight:700;letter-spacing:.05em}
.g-stats{display:flex;gap:8px}
.stat-pill{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:var(--fd);font-size:.6rem;font-weight:700}
.stat-pill em{font-style:normal;color:var(--cyan)}
.prog-bar{width:100%;max-width:700px;height:5px;background:var(--s2);border-radius:3px;margin-bottom:20px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:3px;transition:width .95s linear;background:linear-gradient(90deg,var(--cyan),var(--purple))}
.g-area{width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center}

/* ─ Click Frenzy ─ */
.click-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
#click-count{font-family:var(--fd);font-size:5rem;font-weight:900;color:var(--cyan);text-shadow:0 0 30px rgba(0,245,255,.4);line-height:1}
.click-label{color:var(--dim);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
#click-btn{width:195px;height:195px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--cyan),var(--purple));font-size:3.5rem;cursor:pointer;box-shadow:0 0 50px rgba(0,245,255,.3),inset 0 -5px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s}
#click-btn:hover{box-shadow:0 0 70px rgba(0,245,255,.5),inset 0 -5px 0 rgba(0,0,0,.25)}
#click-btn:active{transform:scale(.87);box-shadow:0 0 20px rgba(0,245,255,.2)}
#click-btn:disabled{opacity:.4;cursor:default}

/* ── RESULTS SCREEN ── */
#results-screen .res-card{max-width:440px;width:100%;text-align:center}
.res-emoji{font-size:4.5rem;display:block;margin-bottom:14px;animation:bIn .5s ease}
@keyframes bIn{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.res-gname{font-family:var(--fd);font-size:.6rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.res-pts{font-family:var(--fd);font-size:4.5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.res-pts-lbl{color:var(--dim);font-weight:600;font-size:.8rem;margin-bottom:20px}
.res-bd{background:var(--s2);border-radius:10px;padding:14px;margin-bottom:20px;text-align:left}
.res-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.res-row:last-child{border:none}
.res-row .rv{color:var(--cyan);font-weight:700}
.res-btns{display:flex;gap:10px;justify-content:center}

/* ── RESPONSIVE ── */
@media(max-width:720px){
  .hub-body{grid-template-columns:1fr}
  .lb-panel{max-height:260px}
  .games-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="cd-ov"><div id="cd-num">3</div></div>
<div id="toast"></div>

<div class="screen active" id="auth-screen">
  <div class="wrap">
    <span class="auth-icon">🎮</span>
    <div class="logo">POINT INVADERS</div>
    <div class="tagline">Arcade Hub · Play · Compete · Dominate</div>
    <br>
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>
      <div id="form-login">
        <div class="field"><label class="input-label">Email</label><input class="input" type="email" id="l-email" placeholder="you@email.com"></div>
        <div class="field"><label class="input-label">Password</label><input class="input" type="password" id="l-pass" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full btn-lg" id="btn-login">Launch →</button>
      </div>
      <div id="form-signup" style="display:none">
        <div class="field"><label class="input-label">Username</label><input class="input" type="text" id="s-name" placeholder="CoolPlayer99" maxlength="20"></div>
        <div class="field"><label class="input-label">Email</label><input class="input" type="email" id="s-email" placeholder="you@email.com"></div>
        <div class="field"><label class="input-label">Password (min 6)</label><input class="input" type="password" id="s-pass" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full btn-lg" id="btn-signup">Create Account →</button>
      </div>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>
</div>

<div class="screen" id="hub-screen">
  <div class="hub-bar">
    <div class="hub-logo-sm">⚡ POINT INVADERS</div>
    <div class="hub-right">
      <div class="hub-uname" id="h-uname">PLAYER</div>
      <div class="hub-pts" id="h-pts">🏆 0 PTS</div>
      <button class="btn btn-secondary btn-sm" id="btn-logout">Exit</button>
    </div>
  </div>
  <div class="hub-body">
    <div>
      <div class="sec-label">⚡ SELECT MISSION</div>
      <div class="games-grid">
        <div class="game-card" data-game="click" data-c="cyan">
          <span class="gc-icon">🖱️</span>
          <div class="gc-name" data-c="cyan">CLICK FRENZY</div>
          <div class="gc-desc">Smash the button as fast as you can in 10 seconds!</div>
          <span class="gc-pts" data-c="cyan">UP TO 500 PTS</span>
        </div>
      </div>
    </div>
    <div>
      <div class="sec-label">🏆 LIVE LEADERBOARD</div>
      <div class="lb-panel" id="lb-panel">
        <div class="lb-empty">Loading scores...</div>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="game-screen">
  <div class="g-hdr">
    <button class="btn btn-secondary btn-sm" id="btn-quit">← Quit</button>
    <div class="g-title" id="g-title">GAME</div>
    <div class="g-stats">
      <div class="stat-pill">⏱ <em id="g-time">—</em></div>
      <div class="stat-pill">⭐ <em id="g-pts">0</em></div>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:100%"></div></div>
  <div class="g-area">
    <div id="g-click" class="click-wrap" style="display:none">
      <div id="click-count">0</div>
      <div class="click-label">CLICKS</div>
      <button id="click-btn">🖱️</button>
    </div>
  </div>
</div>

<div class="screen" id="results-screen">
  <div class="card res-card">
    <span class="res-emoji" id="res-emoji">🎉</span>
    <div class="res-gname" id="res-gname">GAME</div>
    <div class="res-pts" id="res-pts">0</div>
    <div class="res-pts-lbl">POINTS EARNED</div>
    <div class="res-bd" id="res-bd"></div>
    <div class="res-btns">
      <button class="btn btn-primary" id="btn-again">Play Again</button>
      <button class="btn btn-secondary" id="btn-hub">Hub</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  🔥 FIREBASE SETUP — CONNECTED TO YOUR REALTIME DATABASE CONFIG
// ══════════════════════════════════════════════════════════════════════
const FB = {
  apiKey:            "AIzaSyC1NZy2ZzNLutYAiE_QjPZGH5CymvGCnDs",
  authDomain:        "neal-with-roblox.firebaseapp.com",
  databaseURL:       "https://neal-with-roblox-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "neal-with-roblox",
  storageBucket:     "neal-with-roblox.firebasestorage.app",
  messagingSenderId: "984878364213",
  appId:             "1:984878364213:web:fb1147a1a5ff0b02d2a37c"
};

let auth = null, db = null;
try { 
  firebase.initializeApp(FB); 
  auth = firebase.auth(); 
  db = firebase.database(); // Connects cleanly to Realtime Database instead of Firestore!
} catch(e) { 
  console.warn('Firebase initialization error:', e.message); 
}

// ════════════════════════════════════════════
//  🌌 PARTICLE BACKGROUND
// ════════════════════════════════════════════
(function(){
  const c = document.getElementById('bg-canvas');
  const x = c.getContext('2d');
  let p=[];
  const resize=()=>{c.width=innerWidth;c.height=innerHeight};
  const init=()=>{p=Array.from({length:110},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,a:Math.random(),da:(Math.random()*.012+.003)*(Math.random()<.5?1:-1),s:Math.random()*.35+.05}))};
  const draw=()=>{x.clearRect(0,0,c.width,c.height);p.forEach(pt=>{pt.a+=pt.da;if(pt.a>1||pt.a<0)pt.da*=-1;pt.y-=pt.s;if(pt.y<-2){pt.y=c.height+2;pt.x=Math.random()*c.width}x.beginPath();x.arc(pt.x,pt.y,pt.r,0,Math.PI*2);x.fillStyle=`rgba(255,255,255,${Math.max(0,Math.min(.65,pt.a))})`;x.fill()});requestAnimationFrame(draw)};
  resize();init();draw();window.addEventListener('resize',()=>{resize();init()});
})();

// ════════════════════════════════════════════
//  📦 GLOBAL STATE
// ════════════════════════════════════════════
let user=null, curGame=null, gTimer=null;
const META = { click: { name: 'CLICK FRENZY', emoji: '🖱️', maxPts: 500 } };

const showScreen=id=>{
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  setTimeout(()=>document.getElementById(id)?.classList.add('active'),40);
};

let _tt;
const toast=(msg,ms=2500)=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),ms)};

const countdown=cb=>{
  const ov=document.getElementById('cd-ov'),nm=document.getElementById('cd-num');
  ov.classList.add('show');let n=3;
  const tick=()=>{nm.className='';nm.textContent=n>0?n:'GO!';void nm.offsetWidth;nm.className='cd-pop';if(n<=0)setTimeout(()=>{ov.classList.remove('show');cb()},700);else{n--;setTimeout(tick,1000)}};
  tick();
};

// ════════════════════════════════════════════
//  🔐 AUTHENTICATION HANDLERS
// ════════════════════════════════════════════
const setErr=msg=>document.getElementById('auth-err').textContent=msg;

document.getElementById('tab-login').onclick=()=>{
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-signup').classList.remove('active');
  document.getElementById('form-login').style.display='';
  document.getElementById('form-signup').style.display='none';
  setErr('');
};
document.getElementById('tab-signup').onclick=()=>{
  document.getElementById('tab-signup').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('form-signup').style.display='';
  document.getElementById('form-login').style.display='none';
  setErr('');
};

document.getElementById('btn-login').onclick=async()=>{
  if(!auth){toast('⚠️ Firebase not configured');return}
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass){setErr('Please fill in all fields.');return}
  try{const c=await auth.signInWithEmailAndPassword(email,pass);await loadUser(c.user.uid)}
  catch(e){setErr(fErr(e.code))}
};

document.getElementById('btn-signup').onclick=async()=>{
  if(!auth||!db){toast('⚠️ Firebase not configured');return}
  const name=document.getElementById('s-name').value.trim();
  const email=document.getElementById('s-email').value.trim();
  const pass=document.getElementById('s-pass').value;
  if(!name||!email||!pass){setErr('Please fill in all fields.');return}
  if(!/^[a-zA-Z0-9_-]{2,20}$/.test(name)){setErr('Username: 2-20 chars, letters/numbers/_-');return}
  try{
    const c=await auth.createUserWithEmailAndPassword(email,pass);
    // Realtime Database save structure instead of Firestore collection
    await db.ref('players/' + c.user.uid).set({
      username: name,
      totalPoints: 0,
      gamesPlayed: 0
    });
    await loadUser(c.user.uid);
  }catch(e){setErr(fErr(e.code))}
};

const fErr=c=>({'auth/email-already-in-use':'Email already in use.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account found.','auth/weak-password':'Password must be 6+ characters.','auth/invalid-email':'Invalid email.','auth/invalid-credential':'Email or password is incorrect.'}[c]||'Something went wrong. Try again.');

// ── FIXED USER LOADING FROM REALTIME DATABASE ──
async function loadUser(uid){
  if(!db)return;
  db.ref('players/' + uid).once('value', (snapshot) => {
    const data = snapshot.exists() ? snapshot.val() : { username: 'Player', totalPoints: 0, gamesPlayed: 0 };
    user = { uid, ...data };
    enterHub();
  });
}

if(auth)auth.onAuthStateChanged(async u=>{if(u&&!user)await loadUser(u.uid)});

document.getElementById('btn-logout').onclick=()=>{
  if(auth)auth.signOut();
  user=null;showScreen('auth-screen');toast('👋 See you next time!');
};

// ════════════════════════════════════════════
//  🏠 HUB
// ════════════════════════════════════════════
function enterHub(){
  document.getElementById('h-uname').textContent=user.username;
  document.getElementById('h-pts').textContent=`🏆 ${(user.totalPoints||0).toLocaleString()} PTS`;
  showScreen('hub-screen');
  loadLeaderboard();
}

document.querySelectorAll('.game-card').forEach(card=>{
  card.addEventListener('click',()=>{
    const gid=card.dataset.game;
    curGame=gid;
    document.getElementById('g-title').textContent=META[gid].name;
    showScreen('game-screen');
    prepGame(gid);
  });
});

document.getElementById('btn-quit').onclick=()=>{clearInterval(gTimer);enterHub()};

// ════════════════════════════════════════════
//  🎮 GAME ENGINE
// ════════════════════════════════════════════
function prepGame(gid){
  document.querySelectorAll('.g-area>div').forEach(d=>d.style.display='none');
  document.getElementById('g-pts').textContent='0';
  document.getElementById('g-time').textContent='—';
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('prog-fill').style.background='var(--cyan)';
  countdown(()=>startClick());
}

const setLive=n=>document.getElementById('g-pts').textContent=n;

function showResults(gid,pts,bd){
  clearInterval(gTimer);
  const m=META[gid],pct=pts/m.maxPts;
  document.getElementById('res-emoji').textContent=pct>.75?'🎉':'💪';
  document.getElementById('res-gname').textContent=m.name;
  document.getElementById('res-pts').textContent=pts;
  document.getElementById('res-bd').innerHTML=Object.entries(bd).map(([k,v])=>`<div class="res-row"><span>${k}</span><span class="rv">${v}</span></div>`).join('');
  showScreen('results-screen');
  saveScore(gid,pts);
  document.getElementById('btn-again').onclick=()=>{showScreen('game-screen');prepGame(gid)};
  document.getElementById('btn-hub').onclick=()=>{document.getElementById('h-pts').textContent=`🏆 ${(user?.totalPoints||0).toLocaleString()} PTS`;enterHub()};
}

// ── FIXED SCORE SAVING FOR REALTIME DATABASE ──
async function saveScore(gid,pts){
  if(!db || !user) return;
  try {
    const playerRef = db.ref('players/' + user.uid);
    playerRef.once('value', (snapshot) => {
      const d = snapshot.val() || { totalPoints: 0, gamesPlayed: 0, highScores: {} };
      const hs = d.highScores || {};
      
      const newPoints = (d.totalPoints || 0) + pts;
      const newGamesPlayed = (d.gamesPlayed || 0) + 1;
      const newHighScores = { ...hs, [gid]: Math.max(hs[gid] || 0, pts) };
      
      playerRef.update({
        username: user.username,
        totalPoints: newPoints,
        gamesPlayed: newGamesPlayed,
        highScores: newHighScores
      });
      
      if (user) user.totalPoints = newPoints;
    });
    toast(`✅ +${pts} pts saved!`);
  } catch (e) {
    toast('⚠️ Score not saved');
    console.error(e);
  }
}

// ════════════════════════════════════════════
//  🖱️ GAME: CLICK FRENZY
// ════════════════════════════════════════════
function startClick(){
  document.getElementById('g-click').style.display='flex';
  let clicks=0,t=10;
  document.getElementById('click-count').textContent='0';
  document.getElementById('g-time').textContent='10';
  const btn=document.getElementById('click-btn');
  btn.disabled=false;
  btn.onclick=()=>{clicks++;document.getElementById('click-count').textContent=clicks;setLive(Math.min(500,clicks*8))};
  gTimer=setInterval(()=>{
    t--;
    document.getElementById('g-time').textContent=t;
    document.getElementById('prog-fill').style.width=`${t/10*100}%`;
    if(t<=0){
      clearInterval(gTimer);btn.disabled=true;btn.onclick=null;
      const pts=Math.min(500,clicks*8);
      setTimeout(()=>showResults('click',pts,{'🖱️ Total Clicks':clicks,'⚡ Pts/click':8,'🏆 Final Score':`${pts} pts`}),400);
    }
  },1000);
}

// ════════════════════════════════════════════
//  🏆 LEADERBOARD LOAD (REALTIME DATABASE VERSION)
// ════════════════════════════════════════════
async function loadLeaderboard(){
  const panel=document.getElementById('lb-panel');
  if(!db){panel.innerHTML='<div class="lb-empty">⚠️ Database connecting...</div>';return}
  panel.innerHTML='<div class="lb-empty">Loading...</div>';
  try{
    // Queries top players by sorting totalPoints in your Realtime Database node
    db.ref('players').orderByChild('totalPoints').limitToLast(20).once('value', (snapshot) => {
      if (!snapshot.exists()) {
        panel.innerHTML = '<div class="lb-empty">No players yet — be first!</div>';
        return;
      }
      
      const players = [];
      snapshot.forEach((child) => {
        players.push({ uid: child.key, ...child.val() });
      });
      
      // Realtime database sorts values ascending, so reverse it for descending list
      players.reverse();
      
      const medals = ['🥇', '🥈', '🥉'];
      panel.innerHTML = '<div class="lb-title">🏆 TOP PLAYERS</div>';
      
      players.forEach((d, i) => {
        const isMe = user && d.uid === user.uid;
        const cls = isMe ? 'me' : i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
        const row = document.createElement('div'); 
        row.className = `lb-row ${cls}`;
        row.innerHTML = `<div class="lb-rank">${medals[i] || '#' + (i + 1)}</div><div class="lb-name">${esc(d.username)}${isMe ? ' ← You' : ''}</div><div class="lb-score">${(d.totalPoints || 0).toLocaleString()} PTS</div>`;
        panel.appendChild(row);
      });
    });
  }catch(e){panel.innerHTML='<div class="lb-empty">⚠️ Error loading scores</div>';console.error(e)}
}

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── BOOT ──
showScreen('auth-screen');
</script>
