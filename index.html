<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POINT INVADERS — Arcade Hub 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="cd-ov"><div id="cd-num">3</div></div>
<div id="toast"></div>

<div class="screen active" id="auth-screen">
  <div class="wrap">
    <span class="auth-icon">🎮</span>
    <div class="logo">POINT INVADERS</div>
    <div class="tagline">Arcade Hub · Play · Compete · Dominate</div>
    <br>
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>
      <div id="form-login">
        <div class="field"><label class="input-label">Email</label><input class="input" type="email" id="l-email" placeholder="you@email.com"></div>
        <div class="field"><label class="input-label">Password</label><input class="input" type="password" id="l-pass" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full btn-lg" id="btn-login">Launch →</button>
      </div>
      <div id="form-signup" style="display:none">
        <div class="field"><label class="input-label">Username</label><input class="input" type="text" id="s-name" placeholder="CoolPlayer99" maxlength="20"></div>
        <div class="field"><label class="input-label">Email</label><input class="input" type="email" id="s-email" placeholder="you@email.com"></div>
        <div class="field"><label class="input-label">Password (min 6)</label><input class="input" type="password" id="s-pass" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full btn-lg" id="btn-signup">Create Account →</button>
      </div>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>
</div>

<div class="screen" id="hub-screen">
  <div class="hub-bar">
    <div class="hub-logo-sm">⚡ POINT INVADERS</div>
    <div class="hub-right">
      <div class="hub-uname" id="h-uname">PLAYER</div>
      <div class="hub-pts" id="h-pts">🏆 0 PTS</div>
      <button class="btn btn-secondary btn-sm" id="btn-logout">Exit</button>
    </div>
  </div>
  <div class="hub-body">
    <div>
      <div class="sec-label">⚡ SELECT MISSION</div>
      <div class="games-grid">
        <div class="game-card" data-game="click" data-c="cyan">
          <span class="gc-icon">🖱️</span>
          <div class="gc-name" data-c="cyan">CLICK FRENZY</div>
          <div class="gc-desc">Smash the button as fast as you can in 10 seconds!</div>
          <span class="gc-pts" data-c="cyan">UP TO 500 PTS</span>
        </div>
      </div>
    </div>
    <div>
      <div class="sec-label">🏆 LIVE LEADERBOARD</div>
      <div class="lb-panel" id="lb-panel">
        <div class="lb-empty">Loading scores...</div>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="game-screen">
  <div class="g-hdr">
    <button class="btn btn-secondary btn-sm" id="btn-quit">← Quit</button>
    <div class="g-title" id="g-title">GAME</div>
    <div class="g-stats">
      <div class="stat-pill">⏱ <em id="g-time">—</em></div>
      <div class="stat-pill">⭐ <em id="g-pts">0</em></div>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:100%"></div></div>
  <div class="g-area">
    <div id="g-click" class="click-wrap" style="display:none">
      <div id="click-count">0</div>
      <div class="click-label">CLICKS</div>
      <button id="click-btn">🖱️</button>
    </div>
  </div>
</div>

<div class="screen" id="results-screen">
  <div class="card res-card">
    <span class="res-emoji" id="res-emoji">🎉</span>
    <div class="res-gname" id="res-gname">GAME</div>
    <div class="res-pts" id="res-pts">0</div>
    <div class="res-pts-lbl">POINTS EARNED</div>
    <div class="res-bd" id="res-bd"></div>
    <div class="res-btns">
      <button class="btn btn-primary" id="btn-again">Play Again</button>
      <button class="btn btn-secondary" id="btn-hub">Hub</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
